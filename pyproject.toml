[project]
name = "mpvrp-cc"
version = "0.1.0"
description = "Generation and MILP optimization tools for the MPVRP-CC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "folium>=0.20.0",
    "gurobipy>=13.0.1",
    "matplotlib>=3.10.9",
    "networkx>=3.6.1",
    "numpy>=2.4.4",
    "ortools>=9.15.6755",
    "osmnx>=2.1.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
]

[project.scripts]
mpvrp-generate = "mpvrp_cc.generation.instance_generator:main"
mpvrp-validate = "mpvrp_cc.cli.validate_instance:main"
mpvrp-prepare-scenarios = "mpvrp_cc.experiments.create_changeover_scenarios:main"
mpvrp-generate-benchmark = "mpvrp_cc.experiments.generate_benchmark:main"
mpvrp-solve-benchmark = "mpvrp_cc.experiments.solve_benchmark:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
