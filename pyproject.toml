[project]
name = "mpvrp-cc"
version = "0.1.0"
description = "Generation and MILP optimization tools for the MPVRP-CC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gurobipy>=13.0.1",
    "loguru>=0.7.3",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "ruff>=0.16.9",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=7.4.4",
]

[project.scripts]
mpvrp-generate = "tools.instances.generate:main"
mpvrp-validate = "tools.instances.validate:main"
mpvrp-prepare-scenarios = "tools.changeovers.pair:main"
mpvrp-reevaluate-changeovers = "tools.changeovers.reevaluate:main"
mpvrp-generate-benchmark = "tools.benchmarks.generate:main"
mpvrp-solve-benchmark = "milp.solve:main"
mpvrp-plot = "tools.plot:main"
mpvrp-check-solution = "tools.check_solution:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["paths"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["_prototype*"]
