[project]
name = "mpvrp-cc"
version = "0.1.0"
description = "Generation and MILP optimization tools for the MPVRP-CC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gurobipy>=13.0.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=7.4.4",
]

[project.scripts]
mpvrp-generate = "tools.gen:main"
mpvrp-validate = "tools.validation:main"
mpvrp-prepare-scenarios = "tools.scenarios:main"
mpvrp-reevaluate-changeovers = "tools.reevaluate:main"
mpvrp-generate-benchmark = "tools.benchmark:main"
mpvrp-solve-benchmark = "tools.solve:main"
mpvrp-plot-lp2-results = "tools.plot_lp2_results:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["code"]
